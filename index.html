<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1030">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Octofy</title>
<style>
:root{
  --bg:#0f0a1e; --panel:#1a1030; --panel2:#241747; --line:#2e2057;
  --text:#f1ecff; --muted:#9d90c9; --accent:#8b5cf6; --accent2:#a78bfa;
  --mine:#7c3aed; --theirs:#2a1d52; --danger:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}

/* ---------- auth ---------- */
#auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(900px 500px at 50% -10%,#3b1d8a55,transparent),var(--bg)}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:28px}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo img{width:44px;height:44px;border-radius:12px}
.logo h1{font-size:28px;letter-spacing:.5px}
.sub{color:var(--muted);margin-bottom:22px;font-size:14px}
.field{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;outline:none}
.field:focus{border-color:var(--accent)}
.btn{width:100%;background:linear-gradient(135deg,var(--accent),#6d28d9);border-radius:14px;padding:13px;font-weight:600}
.btn:disabled{opacity:.5}
.link{color:var(--accent2);font-size:14px;margin-top:14px;display:block;text-align:center;width:100%}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-bottom:8px}

/* ---------- app ---------- */
#app{height:100%;display:flex}
#side{width:340px;max-width:100%;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.me{display:flex;align-items:center;gap:10px;min-width:0}
.me b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{color:var(--muted)}
.icons{display:flex;gap:4px}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--accent2);font-size:18px}
.ib:active,.ib:hover{background:var(--panel2)}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;font-size:17px}
.av.s{width:36px;height:36px;font-size:14px}
#search{margin:12px 16px 4px;width:calc(100% - 32px)}
#list{flex:1;overflow-y:auto}
.row{display:flex;gap:12px;padding:12px 16px;align-items:center;cursor:pointer}
.row:hover,.row.act{background:var(--panel2)}
.row .meta{flex:1;min-width:0}
.row .l1{display:flex;justify-content:space-between;gap:8px}
.row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tm{color:var(--muted);font-size:12px;flex:none}
.row .pv{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.empty{color:var(--muted);text-align:center;padding:40px 24px;font-size:14px;line-height:1.5}

#main{flex:1;display:flex;flex-direction:column;height:100%;min-width:0;
  background:radial-gradient(700px 400px at 80% 0,#3b1d8a22,transparent),var(--bg)}
#chatHead{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
#back{display:none}
#chatHead .t b{display:block}
#chatHead .t small{color:var(--muted)}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:4px}
.day{align-self:center;color:var(--muted);font-size:12px;background:var(--panel);padding:4px 12px;border-radius:99px;margin:10px 0}
.m{max-width:78%;padding:9px 13px;border-radius:18px;line-height:1.4;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;position:relative}
.m.me{align-self:flex-end;background:var(--mine);border-bottom-right-radius:6px}
.m.th{align-self:flex-start;background:var(--theirs);border-bottom-left-radius:6px}
.m .who{font-size:12px;color:var(--accent2);font-weight:600;margin-bottom:2px}
.m .ts{font-size:11px;color:#ffffff99;text-align:right;margin-top:3px}
.m.pending{opacity:.6}
#composer{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);align-items:flex-end}
#text{flex:1;resize:none;max-height:140px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:11px 16px;outline:none}
#text:focus{border-color:var(--accent)}
#send{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#6d28d9);display:grid;place-items:center;font-size:18px;flex:none}
#placeholder{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
#modal .card{max-width:400px}
#modal h2{margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:10px;border-radius:12px;background:var(--panel2);color:var(--muted)}
.tab.on{background:var(--accent);color:#fff}
.found{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;cursor:pointer}
.found:hover{background:var(--panel2)}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--panel2);border-radius:99px;padding:5px 10px;margin:0 6px 6px 0;font-size:13px}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 18px;border-radius:14px;z-index:20;font-size:14px}

@media (max-width:760px){
  #side{width:100%}
  #main{position:fixed;inset:0;transform:translateX(100%);transition:transform .22s;z-index:5}
  #app.chat #main{transform:none}
  #back{display:grid}
}
</style>
</head>
<body>

<!-- ===== Авторизация ===== -->
<div id="auth" class="hidden">
  <form class="card" id="authForm">
    <div class="logo"><img src="icon.svg" alt=""><h1>Octofy</h1></div>
    <p class="sub" id="authSub">Войдите, чтобы начать общение</p>
    <input class="field hidden" id="aUser" placeholder="Имя пользователя (латиницей)" autocomplete="username" maxlength="24">
    <input class="field" id="aEmail" type="email" placeholder="Email" autocomplete="email" required>
    <input class="field" id="aPass" type="password" placeholder="Пароль (мин. 6 символов)" autocomplete="current-password" required minlength="6">
    <div class="err" id="aErr"></div>
    <button class="btn" id="aBtn" type="submit">Войти</button>
    <button class="link" id="aSwitch" type="button">Нет аккаунта? Зарегистрироваться</button>
  </form>
</div>

<!-- ===== Приложение ===== -->
<div id="app" class="hidden">
  <aside id="side">
    <div class="top">
      <div class="me">
        <div class="av s" id="meAv"></div>
        <div style="min-width:0"><b id="meName"></b><small id="meUser"></small></div>
      </div>
      <div class="icons">
        <button class="ib" id="newBtn" title="Новый чат">✎</button>
        <button class="ib" id="outBtn" title="Выйти">⎋</button>
      </div>
    </div>
    <input class="field" id="search" placeholder="Поиск по чатам">
    <div id="list"></div>
  </aside>

  <section id="main">
    <div id="placeholder">Выберите чат слева<br>или начните новый кнопкой ✎</div>
    <div id="chatView" class="hidden" style="display:none;flex-direction:column;flex:1;min-height:0">
      <div id="chatHead">
        <button class="ib" id="back">‹</button>
        <div class="av s" id="hAv"></div>
        <div class="t"><b id="hName"></b><small id="hSub"></small></div>
      </div>
      <div id="msgs"></div>
      <form id="composer">
        <textarea id="text" rows="1" placeholder="Сообщение" maxlength="4000"></textarea>
        <button id="send" type="submit" title="Отправить">➤</button>
      </form>
    </div>
  </section>
</div>

<div id="modal" class="hidden"></div>
<div id="toast" class="hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =====================================================
   НАСТРОЙКА: вставьте сюда URL проекта и ПУБЛИЧНЫЙ anon-ключ.
   service_role ключ сюда вставлять НЕЛЬЗЯ.
   ===================================================== */
const SUPABASE_URL = "https://yazpmmblkaqfqkvvunxx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_mY06Ec-IvvHyk7DFYhwPpQ_xYmQIyPn";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);

let me = null;              // { id, username, display_name }
let convs = [];             // список бесед
let profiles = {};          // id -> profile
let lastMsg = {};           // conversation_id -> последнее сообщение
let current = null;         // открытая беседа
let channel = null;

/* ---------- утилиты ---------- */
const COLORS = ["#8b5cf6","#ec4899","#06b6d4","#f59e0b","#10b981","#ef4444","#3b82f6","#a855f7"];
const colorFor = s => COLORS[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0) % COLORS.length];
function avatar(el, name){ el.textContent = (name||"?").trim().charAt(0).toUpperCase(); el.style.background = colorFor(name||"?"); }
function toast(t){ const el=$("toast"); el.textContent=t; el.classList.remove("hidden"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.add("hidden"),3200); }
const fmtTime = d => new Date(d).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
function fmtListTime(d){
  const x=new Date(d), n=new Date();
  if(x.toDateString()===n.toDateString()) return fmtTime(d);
  return x.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"});
}
const fmtDay = d => new Date(d).toLocaleDateString("ru-RU",{day:"numeric",month:"long"});
function errText(e){
  const m=(e&&e.message)||String(e);
  if(/user not found/i.test(m)) return "Пользователь не найден";
  if(/yourself/i.test(m)) return "Нельзя написать самому себе";
  if(/Invalid login/i.test(m)) return "Неверный email или пароль";
  if(/already registered/i.test(m)) return "Этот email уже зарегистрирован";
  if(/Email not confirmed/i.test(m)) return "Подтвердите email по письму";
  return m;
}

/* ---------- авторизация ---------- */
let signUpMode = false;
function setMode(up){
  signUpMode = up;
  $("aUser").classList.toggle("hidden", !up);
  $("aBtn").textContent = up ? "Создать аккаунт" : "Войти";
  $("aSwitch").textContent = up ? "Уже есть аккаунт? Войти" : "Нет аккаунта? Зарегистрироваться";
  $("authSub").textContent = up ? "Создайте аккаунт за минуту" : "Войдите, чтобы начать общение";
  $("aPass").autocomplete = up ? "new-password" : "current-password";
  $("aErr").textContent = "";
}
$("aSwitch").onclick = () => setMode(!signUpMode);
$("authForm").onsubmit = async e => {
  e.preventDefault();
  $("aErr").textContent=""; $("aBtn").disabled=true;
  const email=$("aEmail").value.trim(), password=$("aPass").value;
  try{
    if(signUpMode){
      const username=$("aUser").value.trim().toLowerCase();
      if(!/^[a-z0-9_]{3,24}$/.test(username)) throw new Error("Имя: 3–24 символа, a-z, 0-9, _");
      const {data,error}=await sb.auth.signUp({email,password,options:{data:{username,display_name:username},emailRedirectTo:"https://morix427-star.github.io/Octofy1/"}});
      if(error) throw error;
      if(!data.session){ $("aErr").style.color="#a7f3d0"; $("aErr").textContent="Проверьте почту и подтвердите email, затем войдите."; setMode(false); }
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password});
      if(error) throw error;
    }
  }catch(err){ $("aErr").style.color=""; $("aErr").textContent=errText(err); }
  $("aBtn").disabled=false;
};
$("outBtn").onclick = async () => { await sb.auth.signOut(); };

sb.auth.onAuthStateChange((ev, session) => {
  if(session) boot(session.user);
  else showAuth();
});

function showAuth(){
  teardown();
  $("app").classList.add("hidden"); $("auth").classList.remove("hidden");
}

/* ---------- запуск ---------- */
let booted = null;
async function boot(user){
  if(booted===user.id) return; booted=user.id;
  const {data,error}=await sb.from("profiles").select("*").eq("id",user.id).single();
  if(error||!data){ toast("Профиль не найден. Выполнили ли вы schema.sql?"); booted=null; return; }
  me=data; profiles[me.id]=me;
  $("auth").classList.add("hidden"); $("app").classList.remove("hidden");
  avatar($("meAv"), me.display_name||me.username);
  $("meName").textContent = me.display_name||me.username;
  $("meUser").textContent = "@"+me.username;
  await loadConversations();
  subscribe();
}
function teardown(){
  booted=null; me=null; convs=[]; current=null; lastMsg={};
  if(channel){ sb.removeChannel(channel); channel=null; }
  $("list").innerHTML=""; $("msgs").innerHTML="";
  closeChat();
}

/* ---------- список бесед ---------- */
async function loadConversations(){
  const {data,error}=await sb.from("conversations")
    .select("id,type,title,last_message_at,conversation_members(user_id)")
    .order("last_message_at",{ascending:false});
  if(error){ toast(errText(error)); return; }
  convs=data||[];
  const ids=new Set();
  convs.forEach(c=>c.conversation_members.forEach(m=>ids.add(m.user_id)));
  const need=[...ids].filter(i=>!profiles[i]);
  if(need.length){
    const {data:ps}=await sb.from("profiles").select("*").in("id",need);
    (ps||[]).forEach(p=>profiles[p.id]=p);
  }
  if(convs.length){
    const {data:ms}=await sb.from("messages").select("conversation_id,body,created_at,sender_id")
      .in("conversation_id",convs.map(c=>c.id)).order("created_at",{ascending:false}).limit(300);
    (ms||[]).forEach(m=>{ if(!lastMsg[m.conversation_id]) lastMsg[m.conversation_id]=m; });
  }
  renderList();
}
function convTitle(c){
  if(c.type==="group") return c.title||"Группа";
  const other=c.conversation_members.find(m=>m.user_id!==me.id);
  const p=other&&profiles[other.user_id];
  return p ? (p.display_name||p.username) : "Чат";
}
function convSub(c){
  if(c.type==="group") return c.conversation_members.length+" участн.";
  const other=c.conversation_members.find(m=>m.user_id!==me.id);
  const p=other&&profiles[other.user_id];
  return p?("@"+p.username):"";
}
function renderList(){
  const q=$("search").value.trim().toLowerCase();
  const box=$("list"); box.innerHTML="";
  const items=convs.filter(c=>!q||convTitle(c).toLowerCase().includes(q));
  if(!items.length){
    const d=document.createElement("div"); d.className="empty";
    d.textContent = q ? "Ничего не найдено" : "Пока нет чатов. Нажмите ✎, чтобы написать кому-нибудь.";
    box.appendChild(d); return;
  }
  items.sort((a,b)=>new Date(b.last_message_at)-new Date(a.last_message_at));
  items.forEach(c=>{
    const row=document.createElement("div"); row.className="row"+(current&&current.id===c.id?" act":"");
    const av=document.createElement("div"); av.className="av"; avatar(av,convTitle(c));
    const meta=document.createElement("div"); meta.className="meta";
    const l1=document.createElement("div"); l1.className="l1";
    const nm=document.createElement("span"); nm.className="nm"; nm.textContent=convTitle(c);
    const tm=document.createElement("span"); tm.className="tm";
    const lm=lastMsg[c.id]; tm.textContent=lm?fmtListTime(lm.created_at):"";
    l1.append(nm,tm);
    const pv=document.createElement("div"); pv.className="pv";
    pv.textContent = lm ? ((lm.sender_id===me.id?"Вы: ":"")+lm.body) : "Нет сообщений";
    meta.append(l1,pv); row.append(av,meta);
    row.onclick=()=>openChat(c.id);
    box.appendChild(row);
  });
}
$("search").oninput=renderList;

/* ---------- чат ---------- */
async function openChat(id){
  current=convs.find(c=>c.id===id); if(!current) return;
  $("placeholder").classList.add("hidden"); $("placeholder").style.display="none";
  const cv=$("chatView"); cv.classList.remove("hidden"); cv.style.display="flex";
  $("app").classList.add("chat");
  avatar($("hAv"),convTitle(current));
  $("hName").textContent=convTitle(current); $("hSub").textContent=convSub(current);
  $("msgs").innerHTML="";
  renderList();
  const {data,error}=await sb.from("messages").select("*").eq("conversation_id",id)
    .order("created_at",{ascending:false}).limit(100);
  if(error){ toast(errText(error)); return; }
  if(!current||current.id!==id) return;
  lastDay=null; $("msgs").innerHTML="";
  (data||[]).reverse().forEach(addBubble);
  scrollDown();
  markRead(id);
}
function closeChat(){
  current=null;
  $("app").classList.remove("chat");
  const cv=$("chatView"); cv.classList.add("hidden"); cv.style.display="none";
  $("placeholder").classList.remove("hidden"); $("placeholder").style.display="grid";
  renderList();
}
$("back").onclick=closeChat;

let lastDay=null;
function addBubble(m){
  const box=$("msgs");
  const day=new Date(m.created_at).toDateString();
  if(day!==lastDay){ lastDay=day; const d=document.createElement("div"); d.className="day"; d.textContent=fmtDay(m.created_at); box.appendChild(d); }
  const mine=m.sender_id===me.id;
  const b=document.createElement("div"); b.className="m "+(mine?"me":"th"); b.dataset.id=m.id;
  if(m.pending) b.classList.add("pending");
  if(!mine && current && current.type==="group"){
    const w=document.createElement("div"); w.className="who";
    const p=profiles[m.sender_id]; w.textContent=p?(p.display_name||p.username):"…"; b.appendChild(w);
  }
  const t=document.createElement("div"); t.textContent=m.body; b.appendChild(t);
  const ts=document.createElement("div"); ts.className="ts"; ts.textContent=fmtTime(m.created_at); b.appendChild(ts);
  box.appendChild(b);
  return b;
}
function scrollDown(){ const b=$("msgs"); b.scrollTop=b.scrollHeight; }
async function markRead(id){
  await sb.from("conversation_members").update({last_read_at:new Date().toISOString()})
    .eq("conversation_id",id).eq("user_id",me.id);
}

/* ---------- отправка ---------- */
const ta=$("text");
ta.addEventListener("input",()=>{ ta.style.height="auto"; ta.style.height=Math.min(ta.scrollHeight,140)+"px"; });
ta.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey&&!/Android|iPhone|iPad/i.test(navigator.userAgent)){ e.preventDefault(); $("composer").requestSubmit(); }
});
$("composer").onsubmit=async e=>{
  e.preventDefault();
  const body=ta.value.trim(); if(!body||!current) return;
  ta.value=""; ta.style.height="auto";
  const tmpId="tmp"+Date.now();
  const el=addBubble({id:tmpId,sender_id:me.id,body,created_at:new Date().toISOString(),pending:true});
  scrollDown();
  const {data,error}=await sb.from("messages").insert({conversation_id:current.id,sender_id:me.id,body}).select().single();
  if(error){ el.remove(); ta.value=body; toast("Не отправлено: "+errText(error)); return; }
  el.dataset.id=data.id; el.classList.remove("pending");
  lastMsg[current.id]=data; renderList();
};

/* ---------- realtime ---------- */
function subscribe(){
  if(channel) sb.removeChannel(channel);
  channel=sb.channel("octofy-"+me.id)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},async payload=>{
      const m=payload.new;
      if(!convs.find(c=>c.id===m.conversation_id)){ await loadConversations(); }
      lastMsg[m.conversation_id]=m;
      const c=convs.find(c=>c.id===m.conversation_id); if(c) c.last_message_at=m.created_at;
      if(current&&current.id===m.conversation_id){
        if(!document.querySelector('[data-id="'+m.id+'"]')){
          if(!profiles[m.sender_id]){ const {data}=await sb.from("profiles").select("*").eq("id",m.sender_id).single(); if(data) profiles[data.id]=data; }
          const nearBottom=$("msgs").scrollHeight-$("msgs").scrollTop-$("msgs").clientHeight<160;
          addBubble(m); if(nearBottom||m.sender_id===me.id) scrollDown();
          if(m.sender_id!==me.id) markRead(m.conversation_id);
        }
      }else if(m.sender_id!==me.id){
        const p=profiles[m.sender_id];
        toast((p?(p.display_name||p.username):"Новое сообщение")+": "+m.body.slice(0,60));
      }
      renderList();
    })
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"conversation_members",filter:"user_id=eq."+me.id},()=>loadConversations())
    .subscribe();
}

/* ---------- новый чат / группа ---------- */
const modal=$("modal");
function closeModal(){ modal.classList.add("hidden"); modal.innerHTML=""; }
modal.addEventListener("click",e=>{ if(e.target===modal) closeModal(); });
$("newBtn").onclick=()=>openNew("direct");

function openNew(mode){
  modal.innerHTML=""; modal.classList.remove("hidden");
  const card=document.createElement("div"); card.className="card";
  const h=document.createElement("h2"); h.textContent="Новый чат"; card.appendChild(h);
  const tabs=document.createElement("div"); tabs.className="tabs";
  [["direct","Личный"],["group","Группа"]].forEach(([k,l])=>{
    const t=document.createElement("button"); t.className="tab"+(mode===k?" on":""); t.textContent=l; t.type="button";
    t.onclick=()=>openNew(k); tabs.appendChild(t);
  });
  card.appendChild(tabs);

  let title=null; const picked=new Map();
  if(mode==="group"){
    title=document.createElement("input"); title.className="field"; title.placeholder="Название группы"; title.maxLength=60; card.appendChild(title);
  }
  const q=document.createElement("input"); q.className="field"; q.placeholder="Найти по имени пользователя"; card.appendChild(q);
  const chips=document.createElement("div"); card.appendChild(chips);
  const res=document.createElement("div"); card.appendChild(res);
  const err=document.createElement("div"); err.className="err"; card.appendChild(err);

  function drawChips(){
    chips.innerHTML="";
    picked.forEach((p,id)=>{
      const c=document.createElement("span"); c.className="chip"; c.textContent="@"+p.username+" ✕";
      c.onclick=()=>{ picked.delete(id); drawChips(); }; chips.appendChild(c);
    });
  }
  let timer;
  q.oninput=()=>{
    clearTimeout(timer);
    timer=setTimeout(async()=>{
      const s=q.value.trim().toLowerCase().replace(/^@/,"").replace(/[^a-z0-9_]/g,"");
      res.innerHTML=""; if(s.length<2) return;
      const {data}=await sb.from("profiles").select("*").ilike("username",s+"%").neq("id",me.id).limit(8);
      (data||[]).forEach(p=>{
        profiles[p.id]=p;
        const r=document.createElement("div"); r.className="found";
        const a=document.createElement("div"); a.className="av s"; avatar(a,p.display_name||p.username);
        const n=document.createElement("div"); n.textContent=(p.display_name||p.username)+"  @"+p.username;
        r.append(a,n);
        r.onclick=async()=>{
          if(mode==="direct"){ await startDirect(p.username,err); }
          else{ picked.set(p.id,p); drawChips(); }
        };
        res.appendChild(r);
      });
      if(!(data||[]).length){ const d=document.createElement("div"); d.className="empty"; d.textContent="Никого не найдено"; res.appendChild(d); }
    },250);
  };
  if(mode==="group"){
    const go=document.createElement("button"); go.className="btn"; go.textContent="Создать группу"; go.type="button";
    go.onclick=async()=>{
      err.textContent="";
      if(!title.value.trim()){ err.textContent="Введите название"; return; }
      if(!picked.size){ err.textContent="Добавьте хотя бы одного участника"; return; }
      go.disabled=true;
      const {data,error}=await sb.rpc("create_group_conversation",{group_title:title.value.trim(),usernames:[...picked.values()].map(p=>p.username)});
      go.disabled=false;
      if(error){ err.textContent=errText(error); return; }
      closeModal(); await loadConversations(); openChat(data);
    };
    card.appendChild(go);
  }
  const cancel=document.createElement("button"); cancel.className="link"; cancel.type="button"; cancel.textContent="Отмена"; cancel.onclick=closeModal;
  card.appendChild(cancel);
  modal.appendChild(card); q.focus();
}
async function startDirect(username,errEl){
  const {data,error}=await sb.rpc("create_direct_conversation",{other_username:username});
  if(error){ errEl.textContent=errText(error); return; }
  closeModal(); await loadConversations(); openChat(data);
}
