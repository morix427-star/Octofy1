<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bubble" gradientUnits="userSpaceOnUse" x1="150" y1="90" x2="370" y2="430">
      <stop offset="0" stop-color="#b79cff"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#3b2278" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1a1238" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- тёмный фон -->
  <rect width="512" height="512" rx="112" fill="#150f2e"/>
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>

  <!-- мягкая тень под пузырём -->
  <ellipse cx="262" cy="392" rx="130" ry="26" fill="#6d28d9" opacity="0.45" filter="url(#soft)"/>

  <!-- пузырь чата -->
  <g>
    <rect x="96" y="96" width="320" height="270" rx="135" fill="url(#bubble)"/>
    <path d="M148 322 Q150 384 98 418 Q186 420 246 360 Z" fill="url(#bubble)"/>
  </g>

  <!-- блик -->
  <path d="M150 190 C150 150 190 118 238 116 C204 128 176 156 170 196 Z" fill="#ffffff" opacity="0.28"/>

  <!-- три точки -->
  <circle cx="196" cy="236" r="25" fill="#ffffff"/>
  <circle cx="256" cy="236" r="25" fill="#ffffff"/>
  <circle cx="316" cy="236" r="25" fill="#ffffff"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
