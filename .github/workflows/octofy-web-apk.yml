name: Build Octofy Web APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir -p octofy-app/www
          cp index.html manifest.json sw.js icon.svg octofy-app/www/
      - name: Create Capacitor project
        working-directory: octofy-app
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init Octofy com.octofy.app --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: octofy-app/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: octofy-apk
          path: octofy-app/android/app/build/outputs/apk/debug/app-debug.apk
