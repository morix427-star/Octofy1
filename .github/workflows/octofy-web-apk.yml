name: Build Octofy Web APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "icon.jpg"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install SVG converter
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Prepare web files
        run: |
          mkdir -p octofy-app/www
          cp index.html manifest.json sw.js icon.svg icon.jpg octofy-app/www/
      - name: Create Capacitor project
        working-directory: octofy-app
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init Octofy com.octofy.app --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Generate app icon
        continue-on-error: true
        working-directory: octofy-app
        run: |
          mkdir -p assets
          cp ../icon.jpg assets/icon.png
          npm i -D @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#150f2e' --iconBackgroundColorDark '#150f2e'
      - name: Build APK
        working-directory: octofy-app/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: octofy-apk
          path: octofy-app/android/app/build/outputs/apk/debug/app-debug.apk
