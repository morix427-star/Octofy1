<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0c20">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Octofy</title>
<style>
:root{
  --bg:#0d0a1f; --panel:#14102b; --panel2:#1d1740; --field:#221a4d; --line:#2a2257;
  --text:#f3efff; --muted:#9a8fc8; --accent:#8b5cf6; --accent2:#a78bfa;
  --mine:#7c3aed; --theirs:#241b4d; --danger:#f87171; --badge:#33265f;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block}
.hidden{display:none!important}

/* ---------- auth ---------- */
#auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(900px 500px at 50% -10%,#4c1d9566,transparent),var(--bg)}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:28px}
.logo{display:flex;align-items:center;gap:12px}
.mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);display:grid;place-items:center;color:#fff;flex:none}
.mark svg{width:24px;height:24px}
.logo h1{font-size:30px;letter-spacing:.3px}
.sub{color:var(--muted);margin:8px 0 22px;font-size:14px}
.field{width:100%;background:var(--field);border:1px solid transparent;border-radius:16px;padding:14px 16px;margin-bottom:10px;outline:none}
.field:focus{border-color:var(--accent)}
.field::placeholder{color:var(--muted)}
.btn{width:100%;background:linear-gradient(135deg,var(--accent),#6d28d9);border-radius:16px;padding:14px;font-weight:600}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--field);color:var(--text);margin-top:10px}
.btn.danger{background:#3b1626;color:var(--danger);margin-top:10px}
.link{color:var(--accent2);font-size:14px;margin-top:14px;display:block;text-align:center;width:100%}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-bottom:8px}

/* ---------- app shell ---------- */
#app{height:100%;display:flex}
#side{width:390px;max-width:100%;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 18px 6px}
.top .logo h1{font-size:28px}
.icons{display:flex;gap:2px}
.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--text)}
.ib:hover,.ib:active{background:var(--panel2)}
.views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:flex;flex-direction:column;padding:0 18px}
.view h2{font-size:30px;margin:10px 0 14px}
.sbox{position:relative;margin-bottom:12px}
.sbox svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);width:20px;height:20px}
.sbox .field{padding-left:46px;margin:0;border-radius:20px;background:var(--panel2);padding-top:15px;padding-bottom:15px}
.chips{display:flex;gap:8px;margin-bottom:8px;overflow-x:auto}
.chp{padding:8px 15px;border-radius:99px;background:var(--panel2);color:var(--text);font-size:14px;flex:none}
.chp.on{background:#2d2060;color:var(--accent2)}
.scroll{flex:1;overflow-y:auto;margin:0 -18px;padding-bottom:10px}
.row{display:flex;gap:14px;padding:12px 18px;align-items:center;cursor:pointer}
.row:hover,.row.act{background:var(--panel)}
.av{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;font-size:22px}
.av.s{width:42px;height:42px;font-size:17px}
.av.xl{width:96px;height:96px;font-size:40px;margin:6px auto 14px}
.row .meta{flex:1;min-width:0}
.row .nm{font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pv{color:var(--muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.row .pv.un{color:var(--text)}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none;min-width:44px}
.row .tm{color:var(--muted);font-size:14px}
.badge{min-width:24px;height:24px;padding:0 7px;border-radius:99px;background:var(--badge);color:var(--accent2);font-size:13px;font-weight:600;display:grid;place-items:center}
.empty{color:var(--muted);text-align:center;padding:44px 24px;font-size:14px;line-height:1.55}

.nav{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:var(--bg)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:12px;padding:6px 14px;border-radius:14px}
.nav button.on{color:var(--accent2)}

/* profile / settings */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.lbl{color:var(--muted);font-size:13px;margin-bottom:6px}
.tg{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.tg + .tg{border-top:1px solid var(--line)}
.sw{width:48px;height:28px;border-radius:99px;background:var(--field);position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--accent)}
.sw.on::after{left:23px}

/* ---------- chat ---------- */
#main{flex:1;display:flex;flex-direction:column;height:100%;min-width:0;
  background:radial-gradient(700px 400px at 80% 0,#4c1d9522,transparent),var(--bg)}
#placeholder{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px;line-height:1.6}
#chatView{flex-direction:column;flex:1;min-height:0}
#chatHead{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#chatHead .t{flex:1;min-width:0}
#chatHead .t b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chatHead .t small{color:var(--muted)}
#back{display:none}
#fav.on{color:#fbbf24}
#fav.on svg{fill:#fbbf24}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:4px}
.day{align-self:center;color:var(--muted);font-size:12px;background:var(--panel);padding:4px 12px;border-radius:99px;margin:10px 0}
.m{max-width:78%;padding:9px 14px;border-radius:20px;line-height:1.4;overflow-wrap:anywhere;white-space:pre-wrap}
.m.me{align-self:flex-end;background:var(--mine);border-bottom-right-radius:6px}
.m.th{align-self:flex-start;background:var(--theirs);border-bottom-left-radius:6px}
.m .who{font-size:12px;color:var(--accent2);font-weight:600;margin-bottom:2px}
.m .ts{font-size:11px;color:#ffffff99;text-align:right;margin-top:3px}
.m.pending{opacity:.6}
#composer{display:flex;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);align-items:flex-end}
#text{flex:1;resize:none;max-height:140px;background:var(--field);border:1px solid transparent;border-radius:22px;padding:12px 18px;outline:none}
#text:focus{border-color:var(--accent)}
#send{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#6d28d9);display:grid;place-items:center;flex:none}

/* ---------- modal / toast ---------- */
#modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px;z-index:30}
#modal h2{margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:11px;border-radius:14px;background:var(--panel2);color:var(--muted)}
.tab.on{background:var(--accent);color:#fff}
.found{display:flex;gap:12px;align-items:center;padding:8px;border-radius:14px;cursor:pointer}
.found:hover{background:var(--panel2)}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--panel2);border-radius:99px;padding:5px 11px;margin:0 6px 6px 0;font-size:13px}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);max-width:92%;background:var(--panel2);border:1px solid var(--line);padding:11px 18px;border-radius:16px;z-index:40;font-size:14px;box-shadow:0 8px 30px #0008}

@media (max-width:820px){
  #side{width:100%}
  #main{position:fixed;inset:0;transform:translateX(100%);transition:transform .22s;z-index:5}
  #app.chat #main{transform:none}
  #back{display:grid}
}
</style>
</head>
<body>

<!-- ===== Авторизация ===== -->
<div id="auth" class="hidden">
  <form class="card" id="authForm">
    <div class="logo"><div class="mark" data-i="chat"></div><h1>Octofy</h1></div>
    <p class="sub" id="authSub">Войдите, чтобы начать общение</p>
    <input class="field hidden" id="aUser" placeholder="Имя пользователя (латиницей)" autocomplete="username" maxlength="24">
    <input class="field" id="aEmail" type="email" placeholder="Email" autocomplete="email" required>
    <input class="field" id="aPass" type="password" placeholder="Пароль (мин. 6 символов)" autocomplete="current-password" required minlength="6">
    <div class="err" id="aErr"></div>
    <button class="btn" id="aBtn" type="submit">Войти</button>
    <button class="link" id="aSwitch" type="button">Нет аккаунта? Зарегистрироваться</button>
  </form>
</div>

<!-- ===== Приложение ===== -->
<div id="app" class="hidden">
  <aside id="side">
    <div class="top">
      <div class="logo"><div class="mark" data-i="chat"></div><h1>Octofy</h1></div>
      <div class="icons">
        <button class="ib" id="topSearch" data-i="search" title="Поиск"></button>
        <button class="ib" id="newBtn" data-i="edit" title="Новый чат"></button>
      </div>
    </div>

    <div class="views">
      <!-- Чаты -->
      <section class="view" id="v-chats">
        <h2>Сообщения</h2>
        <div class="sbox"><span data-i="search"></span><input class="field" id="search" placeholder="Поиск сообщений..."></div>
        <div class="chips" id="chips">
          <button class="chp on" data-f="all">Все</button>
          <button class="chp" data-f="unread">Непрочитанные</button>
          <button class="chp" data-f="fav">Избранное</button>
        </div>
        <div class="scroll" id="list"></div>
      </section>

      <!-- Контакты -->
      <section class="view hidden" id="v-contacts">
        <h2>Контакты</h2>
        <div class="sbox"><span data-i="search"></span><input class="field" id="csearch" placeholder="Найти человека..."></div>
        <div class="scroll" id="clist"></div>
      </section>

      <!-- Профиль -->
      <section class="view hidden" id="v-profile">
        <h2>Профиль</h2>
        <div class="scroll" style="padding:0 18px;margin:0">
          <div class="av xl" id="pAv"></div>
          <div class="panel">
            <div class="lbl">Имя</div>
            <input class="field" id="pName" maxlength="40" style="margin-bottom:12px">
            <div class="lbl">Имя пользователя</div>
            <div id="pUser" style="font-weight:600"></div>
            <div class="err" id="pErr" style="margin:10px 0 0"></div>
          </div>
          <button class="btn" id="pSave">Сохранить</button>
          <button class="btn danger" id="outBtn">Выйти из аккаунта</button>
        </div>
      </section>

      <!-- Настройки -->
      <section class="view hidden" id="v-settings">
        <h2>Настройки</h2>
        <div class="scroll" style="padding:0 18px;margin:0">
          <div class="panel">
            <div class="tg"><span>Уведомления о новых сообщениях</span><button class="sw" id="swNotify" type="button"></button></div>
            <div class="tg"><span>Звук сообщений</span><button class="sw" id="swSound" type="button"></button></div>
          </div>
          <div class="panel">
            <div class="lbl">О приложении</div>
            <div>Octofy · версия 1.1</div>
          </div>
        </div>
      </section>
    </div>

    <nav class="nav" id="nav">
      <button data-v="chats" class="on"><span data-i="chat"></span>Чаты</button>
      <button data-v="contacts"><span data-i="users"></span>Контакты</button>
      <button data-v="profile"><span data-i="user"></span>Профиль</button>
      <button data-v="settings"><span data-i="gear"></span>Настройки</button>
    </nav>
  </aside>

  <section id="main">
    <div id="placeholder">Выберите чат слева<br>или начните новый кнопкой в шапке</div>
    <div id="chatView" class="hidden" style="display:none">
      <div id="chatHead">
        <button class="ib" id="back" data-i="back"></button>
        <div class="av s" id="hAv"></div>
        <div class="t"><b id="hName"></b><small id="hSub"></small></div>
        <button class="ib" id="fav" data-i="star" title="В избранное"></button>
      </div>
      <div id="msgs"></div>
      <form id="composer">
        <textarea id="text" rows="1" placeholder="Сообщение" maxlength="4000"></textarea>
        <button id="send" type="submit" title="Отправить" data-i="send"></button>
      </form>
    </div>
  </section>
</div>

<div id="modal" class="hidden"></div>
<div id="toast" class="hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =====================================================
   НАСТРОЙКА: вставьте URL проекта и ПУБЛИЧНЫЙ anon-ключ.
   service_role ключ сюда вставлять НЕЛЬЗЯ.
   ===================================================== */
const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
const SUPABASE_ANON_KEY = "YOUR-ANON-KEY";

const $ = id => document.getElementById(id);

/* ---------- иконки ---------- */
const ICONS = {
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  chat:'<path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.5L3 20l1.2-4.9A8.5 8.5 0 1 1 21 11.5Z"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 3-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14c2.8.2 4.5 2.2 4.5 5"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>',
  star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/>',
  back:'<path d="m15 18-6-6 6-6"/>',
  send:'<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/>'
};
document.querySelectorAll("[data-i]").forEach(el=>{
  el.innerHTML='<svg class="i" viewBox="0 0 24 24">'+ICONS[el.dataset.i]+'</svg>';
});

if(SUPABASE_URL.includes("YOUR-PROJECT")){
  document.body.innerHTML='<div style="padding:32px;max-width:520px;margin:auto;line-height:1.6"><h2>Octofy: нужна настройка</h2><p>Откройте <b>index.html</b> и впишите <code>SUPABASE_URL</code> и <code>SUPABASE_ANON_KEY</code> (публичный anon-ключ из Supabase → Project Settings → API).</p></div>';
  throw new Error("not configured");
}
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let me = null;
let convs = [];
let profiles = {};
let lastMsg = {};
let unread = {};
let current = null;
let channel = null;
let filter = "all";

/* ---------- утилиты ---------- */
const COLORS = ["#8b5cf6","#0d9488","#c04f9a","#d97706","#059669","#dc2626","#2563eb","#9333ea"];
const colorFor = s => COLORS[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0) % COLORS.length];
function avatar(el, name){ el.textContent=(name||"?").trim().charAt(0).toUpperCase(); el.style.background=colorFor(name||"?"); }
function toast(t){ const el=$("toast"); el.textContent=t; el.classList.remove("hidden"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.add("hidden"),3200); }
const fmtTime = d => new Date(d).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
function fmtListTime(d){
  const x=new Date(d), n=new Date(), y=new Date(); y.setDate(n.getDate()-1);
  if(x.toDateString()===n.toDateString()) return fmtTime(d);
  if(x.toDateString()===y.toDateString()) return "Вчера";
  return x.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"});
}
const fmtDay = d => new Date(d).toLocaleDateString("ru-RU",{day:"numeric",month:"long"});
function errText(e){
  const m=(e&&e.message)||String(e);
  if(/user not found/i.test(m)) return "Пользователь не найден";
  if(/yourself/i.test(m)) return "Нельзя написать самому себе";
  if(/Invalid login/i.test(m)) return "Неверный email или пароль";
  if(/already registered/i.test(m)) return "Этот email уже зарегистрирован";
  if(/Email not confirmed/i.test(m)) return "Подтвердите email по письму";
  return m;
}
const pref = (k,def)=>{ try{ const v=localStorage.getItem(k); return v===null?def:v==="1"; }catch(e){ return def; } };
const setPref = (k,v)=>{ try{ localStorage.setItem(k,v?"1":"0"); }catch(e){} };
function beep(){
  try{
    const a=new (window.AudioContext||window.webkitAudioContext)(); const o=a.createOscillator(), g=a.createGain();
    o.type="sine"; o.frequency.value=880; g.gain.setValueAtTime(.12,a.currentTime); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.25);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+.25);
  }catch(e){}
}

/* ---------- авторизация ---------- */
let signUpMode=false;
function setMode(up){
  signUpMode=up;
  $("aUser").classList.toggle("hidden",!up);
  $("aBtn").textContent=up?"Создать аккаунт":"Войти";
  $("aSwitch").textContent=up?"Уже есть аккаунт? Войти":"Нет аккаунта? Зарегистрироваться";
  $("authSub").textContent=up?"Создайте аккаунт за минуту":"Войдите, чтобы начать общение";
  $("aPass").autocomplete=up?"new-password":"current-password";
  $("aErr").textContent="";
}
$("aSwitch").onclick=()=>setMode(!signUpMode);
$("authForm").onsubmit=async e=>{
  e.preventDefault(); $("aErr").textContent=""; $("aBtn").disabled=true;
  const email=$("aEmail").value.trim(), password=$("aPass").value;
  try{
    if(signUpMode){
      const username=$("aUser").value.trim().toLowerCase();
      if(!/^[a-z0-9_]{3,24}$/.test(username)) throw new Error("Имя: 3–24 символа, a-z, 0-9, _");
      const {data,error}=await sb.auth.signUp({email,password,options:{data:{username,display_name:username}}});
      if(error) throw error;
      if(!data.session){ $("aErr").style.color="#a7f3d0"; $("aErr").textContent="Проверьте почту и подтвердите email, затем войдите."; setMode(false); }
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password});
      if(error) throw error;
    }
  }catch(err){ $("aErr").style.color=""; $("aErr").textContent=errText(err); }
  $("aBtn").disabled=false;
};
$("outBtn").onclick=async()=>{ await sb.auth.signOut(); };
sb.auth.onAuthStateChange((ev,session)=>{ if(session) boot(session.user); else showAuth(); });
function showAuth(){ teardown(); $("app").classList.add("hidden"); $("auth").classList.remove("hidden"); }

/* ---------- запуск ---------- */
let booted=null;
async function boot(user){
  if(booted===user.id) return; booted=user.id;
  const {data,error}=await sb.from("profiles").select("*").eq("id",user.id).single();
  if(error||!data){ toast("Профиль не найден. Выполнен ли schema.sql?"); booted=null; return; }
  me=data; profiles[me.id]=me;
  $("auth").classList.add("hidden"); $("app").classList.remove("hidden");
  fillProfile(); drawSwitches();
  setView("chats");
  await loadConversations();
  subscribe();
}
function teardown(){
  booted=null; me=null; convs=[]; current=null; lastMsg={}; unread={};
  if(channel){ sb.removeChannel(channel); channel=null; }
  $("list").innerHTML=""; $("msgs").innerHTML=""; closeChat();
}

/* ---------- навигация ---------- */
function setView(v){
  ["chats","contacts","profile","settings"].forEach(k=>$("v-"+k).classList.toggle("hidden",k!==v));
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  if(v==="contacts") loadContacts();
}
$("nav").addEventListener("click",e=>{ const b=e.target.closest("button[data-v]"); if(b) setView(b.dataset.v); });
$("topSearch").onclick=()=>{
  const onContacts=!$("v-contacts").classList.contains("hidden");
  if(!onContacts) setView("chats");
  (onContacts?$("csearch"):$("search")).focus();
};
$("chips").addEventListener("click",e=>{
  const b=e.target.closest(".chp"); if(!b) return;
  filter=b.dataset.f;
  document.querySelectorAll(".chp").forEach(x=>x.classList.toggle("on",x===b));
  renderList();
});

/* ---------- беседы ---------- */
const myMember = c => c.conversation_members.find(m=>m.user_id===me.id);
async function loadConversations(){
  const {data,error}=await sb.from("conversations")
    .select("id,type,title,last_message_at,conversation_members(user_id,is_favorite)")
    .order("last_message_at",{ascending:false});
  if(error){
    // если update_1.sql ещё не выполнен, работаем без избранного
    const r=await sb.from("conversations").select("id,type,title,last_message_at,conversation_members(user_id)").order("last_message_at",{ascending:false});
    if(r.error){ toast(errText(r.error)); return; }
    convs=r.data||[];
  }else convs=data||[];

  const ids=new Set(); convs.forEach(c=>c.conversation_members.forEach(m=>ids.add(m.user_id)));
  const need=[...ids].filter(i=>!profiles[i]);
  if(need.length){ const {data:ps}=await sb.from("profiles").select("*").in("id",need); (ps||[]).forEach(p=>profiles[p.id]=p); }

  lastMsg={};
  if(convs.length){
    const {data:ms}=await sb.from("messages").select("conversation_id,body,created_at,sender_id")
      .in("conversation_id",convs.map(c=>c.id)).order("created_at",{ascending:false}).limit(300);
    (ms||[]).forEach(m=>{ if(!lastMsg[m.conversation_id]) lastMsg[m.conversation_id]=m; });
  }
  unread={};
  const u=await sb.rpc("get_unread_counts");
  if(!u.error) (u.data||[]).forEach(r=>unread[r.conversation_id]=Number(r.cnt));
  if(current) unread[current.id]=0;
  renderList();
}
function otherProfile(c){
  const o=c.conversation_members.find(m=>m.user_id!==me.id);
  return o&&profiles[o.user_id];
}
function convTitle(c){
  if(c.type==="group") return c.title||"Группа";
  const p=otherProfile(c); return p?(p.display_name||p.username):"Чат";
}
function convSub(c){
  if(c.type==="group") return c.conversation_members.length+" участн.";
  const p=otherProfile(c); return p?("@"+p.username):"";
}
function renderList(){
  const q=$("search").value.trim().toLowerCase();
  const box=$("list"); box.innerHTML="";
  let items=convs.filter(c=>!q||convTitle(c).toLowerCase().includes(q));
  if(filter==="unread") items=items.filter(c=>unread[c.id]>0);
  if(filter==="fav") items=items.filter(c=>{ const m=myMember(c); return m&&m.is_favorite; });
  if(!items.length){
    const d=document.createElement("div"); d.className="empty";
    d.textContent = q ? "Ничего не найдено"
      : filter==="unread" ? "Непрочитанных сообщений нет"
      : filter==="fav" ? "Отметьте чат звёздочкой в шапке, и он появится здесь"
      : "Пока нет чатов. Нажмите ✎ или выберите человека во вкладке «Контакты».";
    box.appendChild(d); return;
  }
  items.sort((a,b)=>new Date(b.last_message_at)-new Date(a.last_message_at));
  items.forEach(c=>{
    const row=document.createElement("div"); row.className="row"+(current&&current.id===c.id?" act":"");
    const av=document.createElement("div"); av.className="av"; avatar(av,convTitle(c));
    const meta=document.createElement("div"); meta.className="meta";
    const nm=document.createElement("div"); nm.className="nm"; nm.textContent=convTitle(c);
    const lm=lastMsg[c.id];
    const pv=document.createElement("div"); pv.className="pv"+(unread[c.id]>0?" un":"");
    pv.textContent=lm?((lm.sender_id===me.id?"Вы: ":"")+lm.body):"Нет сообщений";
    meta.append(nm,pv);
    const side=document.createElement("div"); side.className="side";
    const tm=document.createElement("span"); tm.className="tm"; tm.textContent=lm?fmtListTime(lm.created_at):"";
    side.appendChild(tm);
    if(unread[c.id]>0){ const b=document.createElement("span"); b.className="badge"; b.textContent=unread[c.id]>99?"99+":unread[c.id]; side.appendChild(b); }
    row.append(av,meta,side);
    row.onclick=()=>openChat(c.id);
    box.appendChild(row);
  });
}
$("search").oninput=renderList;

/* ---------- контакты ---------- */
let cTimer;
async function loadContacts(){
  const s=$("csearch").value.trim().toLowerCase().replace(/[^\p{L}\p{N}_]/gu,"");
  let q=sb.from("profiles").select("*").neq("id",me.id).order("username").limit(50);
  if(s) q=q.or("username.ilike.%"+s+"%,display_name.ilike.%"+s+"%");
  const {data,error}=await q;
  const box=$("clist"); box.innerHTML="";
  if(error){ toast(errText(error)); return; }
  if(!(data||[]).length){ const d=document.createElement("div"); d.className="empty"; d.textContent="Никого не найдено"; box.appendChild(d); return; }
  data.forEach(p=>{
    profiles[p.id]=p;
    const row=document.createElement("div"); row.className="row";
    const av=document.createElement("div"); av.className="av"; avatar(av,p.display_name||p.username);
    const meta=document.createElement("div"); meta.className="meta";
    const nm=document.createElement("div"); nm.className="nm"; nm.textContent=p.display_name||p.username;
    const pv=document.createElement("div"); pv.className="pv"; pv.textContent="@"+p.username;
    meta.append(nm,pv); row.append(av,meta);
    row.onclick=async()=>{
      const {data:id,error:e}=await sb.rpc("create_direct_conversation",{other_username:p.username});
      if(e){ toast(errText(e)); return; }
      setView("chats"); await loadConversations(); openChat(id);
    };
    box.appendChild(row);
  });
}
$("csearch").oninput=()=>{ clearTimeout(cTimer); cTimer=setTimeout(loadContacts,250); };

/* ---------- профиль и настройки ---------- */
function fillProfile(){
  avatar($("pAv"),me.display_name||me.username);
  $("pName").value=me.display_name||me.username;
  $("pUser").textContent="@"+me.username;
}
$("pSave").onclick=async()=>{
  const name=$("pName").value.trim(); $("pErr").style.color=""; $("pErr").textContent="";
  if(!name){ $("pErr").textContent="Введите имя"; return; }
  const {error}=await sb.from("profiles").update({display_name:name}).eq("id",me.id);
  if(error){ $("pErr").textContent=errText(error); return; }
  me.display_name=name; profiles[me.id]=me; fillProfile();
  $("pErr").style.color="#a7f3d0"; $("pErr").textContent="Сохранено";
};
function drawSwitches(){
  $("swNotify").classList.toggle("on",pref("oct_notify",true));
  $("swSound").classList.toggle("on",pref("oct_sound",false));
}
$("swNotify").onclick=()=>{ setPref("oct_notify",!pref("oct_notify",true)); drawSwitches(); };
$("swSound").onclick=()=>{ setPref("oct_sound",!pref("oct_sound",false)); drawSwitches(); if(pref("oct_sound",false)) beep(); };

/* ---------- чат ---------- */
async function openChat(id){
  current=convs.find(c=>c.id===id); if(!current) return;
  $("placeholder").style.display="none";
  const cv=$("chatView"); cv.classList.remove("hidden"); cv.style.display="flex";
  $("app").classList.add("chat");
  avatar($("hAv"),convTitle(current));
  $("hName").textContent=convTitle(current); $("hSub").textContent=convSub(current);
  drawFav();
  $("msgs").innerHTML="";
  unread[id]=0; renderList();
  const {data,error}=await sb.from("messages").select("*").eq("conversation_id",id).order("created_at",{ascending:false}).limit(100);
  if(error){ toast(errText(error)); return; }
  if(!current||current.id!==id) return;
  lastDay=null; $("msgs").innerHTML="";
  (data||[]).reverse().forEach(addBubble);
  scrollDown(); markRead(id);
}
function closeChat(){
  current=null; $("app").classList.remove("chat");
  const cv=$("chatView"); cv.classList.add("hidden"); cv.style.display="none";
  $("placeholder").style.display="grid"; renderList();
}
$("back").onclick=closeChat;
function drawFav(){ const m=current&&myMember(current); $("fav").classList.toggle("on",!!(m&&m.is_favorite)); }
$("fav").onclick=async()=>{
  if(!current) return; const m=myMember(current); if(!m) return;
  const v=!m.is_favorite;
  const {error}=await sb.from("conversation_members").update({is_favorite:v}).eq("conversation_id",current.id).eq("user_id",me.id);
  if(error){ toast("Выполните update_1.sql в Supabase"); return; }
  m.is_favorite=v; drawFav(); renderList();
};

let lastDay=null;
function addBubble(m){
  const box=$("msgs");
  const day=new Date(m.created_at).toDateString();
  if(day!==lastDay){ lastDay=day; const d=document.createElement("div"); d.className="day"; d.textContent=fmtDay(m.created_at); box.appendChild(d); }
  const mine=m.sender_id===me.id;
  const b=document.createElement("div"); b.className="m "+(mine?"me":"th"); b.dataset.id=m.id;
  if(m.pending) b.classList.add("pending");
  if(!mine&&current&&current.type==="group"){
    const w=document.createElement("div"); w.className="who"; const p=profiles[m.sender_id]; w.textContent=p?(p.display_name||p.username):"…"; b.appendChild(w);
  }
  const t=document.createElement("div"); t.textContent=m.body; b.appendChild(t);
  const ts=document.createElement("div"); ts.className="ts"; ts.textContent=fmtTime(m.created_at); b.appendChild(ts);
  box.appendChild(b); return b;
}
function scrollDown(){ const b=$("msgs"); b.scrollTop=b.scrollHeight; }
async function markRead(id){
  await sb.from("conversation_members").update({last_read_at:new Date().toISOString()}).eq("conversation_id",id).eq("user_id",me.id);
}

/* ---------- отправка ---------- */
const ta=$("text");
ta.addEventListener("input",()=>{ ta.style.height="auto"; ta.style.height=Math.min(ta.scrollHeight,140)+"px"; });
ta.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey&&!/Android|iPhone|iPad/i.test(navigator.userAgent)){ e.preventDefault(); $("composer").requestSubmit(); }
});
$("composer").onsubmit=async e=>{
  e.preventDefault();
  const body=ta.value.trim(); if(!body||!current) return;
  ta.value=""; ta.style.height="auto";
  const el=addBubble({id:"tmp"+Date.now(),sender_id:me.id,body,created_at:new Date().toISOString(),pending:true});
  scrollDown();
  const {data,error}=await sb.from("messages").insert({conversation_id:current.id,sender_id:me.id,body}).select().single();
  if(error){ el.remove(); ta.value=body; toast("Не отправлено: "+errText(error)); return; }
  el.dataset.id=data.id; el.classList.remove("pending");
  lastMsg[current.id]=data; current.last_message_at=data.created_at; renderList();
};

/* ---------- realtime ---------- */
function subscribe(){
  if(channel) sb.removeChannel(channel);
  channel=sb.channel("octofy-"+me.id)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},async payload=>{
      const m=payload.new;
      if(!convs.find(c=>c.id===m.conversation_id)){ await loadConversations(); }
      lastMsg[m.conversation_id]=m;
      const c=convs.find(c=>c.id===m.conversation_id); if(c) c.last_message_at=m.created_at;
      const mine=m.sender_id===me.id;
      if(!profiles[m.sender_id]){ const {data}=await sb.from("profiles").select("*").eq("id",m.sender_id).single(); if(data) profiles[data.id]=data; }
      if(current&&current.id===m.conversation_id){
        if(!document.querySelector('[data-id="'+m.id+'"]')){
          const box=$("msgs"); const near=box.scrollHeight-box.scrollTop-box.clientHeight<160;
          addBubble(m); if(near||mine) scrollDown();
          if(!mine) markRead(m.conversation_id);
        }
      }else if(!mine){
        unread[m.conversation_id]=(unread[m.conversation_id]||0)+1;
        const p=profiles[m.sender_id];
        if(pref("oct_notify",true)) toast((p?(p.display_name||p.username):"Новое сообщение")+": "+m.body.slice(0,60));
      }
      if(!mine&&pref("oct_sound",false)) beep();
      renderList();
    })
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"conversation_members",filter:"user_id=eq."+me.id},()=>loadConversations())
    .subscribe();
}

/* ---------- новый чат / группа ---------- */
const modal=$("modal");
function closeModal(){ modal.classList.add("hidden"); modal.innerHTML=""; }
modal.addEventListener("click",e=>{ if(e.target===modal) closeModal(); });
$("newBtn").onclick=()=>openNew("direct");

function openNew(mode){
  modal.innerHTML=""; modal.classList.remove("hidden");
  const card=document.createElement("div"); card.className="card";
  const h=document.createElement("h2"); h.textContent="Новый чат"; card.appendChild(h);
  const tabs=document.createElement("div"); tabs.className="tabs";
  [["direct","Личный"],["group","Группа"]].forEach(([k,l])=>{
    const t=document.createElement("button"); t.className="tab"+(mode===k?" on":""); t.textContent=l; t.type="button";
    t.onclick=()=>openNew(k); tabs.appendChild(t);
  });
  card.appendChild(tabs);
  let title=null; const picked=new Map();
  if(mode==="group"){ title=document.createElement("input"); title.className="field"; title.placeholder="Название группы"; title.maxLength=60; card.appendChild(title); }
  const q=document.createElement("input"); q.className="field"; q.placeholder="Найти по имени пользователя"; card.appendChild(q);
  const chips=document.createElement("div"); card.appendChild(chips);
  const res=document.createElement("div"); card.appendChild(res);
  const err=document.createElement("div"); err.className="err"; card.appendChild(err);
  function drawChips(){
    chips.innerHTML="";
    picked.forEach((p,id)=>{ const c=document.createElement("span"); c.className="chip"; c.textContent="@"+p.username+" ✕"; c.onclick=()=>{ picked.delete(id); drawChips(); }; chips.appendChild(c); });
  }
  let timer;
  q.oninput=()=>{
    clearTimeout(timer);
    timer=setTimeout(async()=>{
      const s=q.value.trim().toLowerCase().replace(/^@/,"").replace(/[^a-z0-9_]/g,"");
      res.innerHTML=""; if(s.length<2) return;
      const {data}=await sb.from("profiles").select("*").ilike("username",s+"%").neq("id",me.id).limit(8);
      (data||[]).forEach(p=>{
        profiles[p.id]=p;
        const r=document.createElement("div"); r.className="found";
        const a=document.createElement("div"); a.className="av s"; avatar(a,p.display_name||p.username);
        const n=document.createElement("div"); n.textContent=(p.display_name||p.username)+"  @"+p.username;
        r.append(a,n);
        r.onclick=async()=>{ if(mode==="direct") await startDirect(p.username,err); else{ picked.set(p.id,p); drawChips(); } };
        res.appendChild(r);
      });
      if(!(data||[]).length){ const d=document.createElement("div"); d.className="empty"; d.textContent="Никого не найдено"; res.appendChild(d); }
    },250);
  };
  if(mode==="group"){
    const go=document.createElement("button"); go.className="btn"; go.textContent="Создать группу"; go.type="button";
    go.onclick=async()=>{
      err.textContent="";
      if(!title.value.trim()){ err.textContent="Введите название"; return; }
      if(!picked.size){ err.textContent="Добавьте хотя бы одного участника"; return; }
      go.disabled=true;
      const {data,error}=await sb.rpc("create_group_conversation",{group_title:title.value.trim(),usernames:[...picked.values()].map(p=>p.username)});
      go.disabled=false;
      if(error){ err.textContent=errText(error); return; }
      closeModal(); setView("chats"); await loadConversations(); openChat(data);
    };
    card.appendChild(go);
  }
  const cancel=document.createElement("button"); cancel.className="link"; cancel.type="button"; cancel.textContent="Отмена"; cancel.onclick=closeModal;
  card.appendChild(cancel);
  modal.appendChild(card); q.focus();
}
async function startDirect(username,errEl){
  const {data,error}=await sb.rpc("create_direct_conversation",{other_username:username});
  if(error){ errEl.textContent=errText(error); return; }
  closeModal(); setView("chats"); await loadConversations(); openChat(data);
}

/* ---------- старт ---------- */
(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(session) boot(session.user); else showAuth();
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
